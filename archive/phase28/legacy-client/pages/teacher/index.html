<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teacher | PHILS LEARNOVA</title><link rel="stylesheet" href="/css/styles.css"></head><body><main class="dashboard"><header class="dashboard-header"><div><p class="eyebrow">TEACHER PORTAL</p><h1>Teaching workspace</h1></div><button id="logout">Sign out</button></header><section class="dashboard-grid"><section class="panel"><h2>Assigned courses</h2><ul id="courses"></ul></section><section class="panel"><h2>Assigned classes</h2><ul id="classes"></ul></section></section><section class="dashboard-grid"><form id="question-form" class="panel"><h2>Add question-bank item</h2><label>Type<select name="question_type"><option value="MULTIPLE_CHOICE">Multiple choice</option><option value="TRUE_FALSE">True or false</option><option value="SHORT_ANSWER">Short answer</option><option value="FILL_BLANK">Fill in the blank</option></select></label><label>Question<textarea name="question_text" required></textarea></label><label>Answer data JSON<textarea name="answer_data" required>{"correct_answer":"","options":[]}</textarea></label><button>Save question</button><p class="message"></p></form><form id="quiz-form" class="panel"><h2>Create quiz</h2><label>Course ID<input name="course_id" type="number" required></label><label>Title<input name="title" required></label><label>Duration in minutes<input name="duration_minutes" type="number" min="1" required></label><label>Access code<input name="access_code"></label><label>Classes<select name="class_ids" multiple size="3"></select></label><label><input name="randomize_questions" type="checkbox"> Randomize questions</label><label><input name="randomize_options" type="checkbox"> Randomize options</label><button>Create draft</button><p class="message"></p></form></section><section class="panel"><h2>Your quizzes</h2><table><thead><tr><th>Title</th><th>Status</th><th>Action</th></tr></thead><tbody id="quizzes"></tbody></table></section></main><script src="/js/api.js"></script><script>
const api = LearnovaApi.apiRequest;
async function load() { try { const [dashboard, quizzes] = await Promise.all([api('/teacher/dashboard'), api('/teacher/quizzes')]); document.querySelector('#courses').innerHTML = dashboard.courses.map((item) => `<li>${item.name} (#${item.id})</li>`).join(''); document.querySelector('#classes').innerHTML = dashboard.classes.map((item) => `<li>${item.name} (${item.code})</li>`).join(''); document.querySelector('select[name="class_ids"]').innerHTML = dashboard.classes.map((item) => `<option value="${item.id}">${item.name} (${item.code})</option>`).join(''); document.querySelector('#quizzes').innerHTML = quizzes.quizzes.map((quiz) => `<tr><td>${quiz.title}</td><td>${quiz.status}</td><td>${quiz.status === 'DRAFT' ? `<button data-publish="${quiz.id}">Publish</button>` : ''}</td></tr>`).join(''); document.querySelectorAll('[data-publish]').forEach((button) => button.addEventListener('click', async () => { await api(`/teacher/quizzes/${button.dataset.publish}/publish`, { method: 'POST', body: '{}' }); load(); })); } catch (error) { document.querySelector('#quizzes').textContent = error.message; } }
async function submit(form, url, transform = (data) => data) { const message = form.querySelector('.message'); try { await api(url, { method: 'POST', body: JSON.stringify(transform(Object.fromEntries(new FormData(form)))) }); form.reset(); message.textContent = 'Saved'; load(); } catch (error) { message.textContent = error.message; } }
document.querySelector('#question-form').addEventListener('submit', (event) => { event.preventDefault(); submit(event.currentTarget, '/teacher/question-bank', (data) => ({ ...data, answer_data: JSON.parse(data.answer_data) })); }); document.querySelector('#quiz-form').addEventListener('submit', (event) => { event.preventDefault(); submit(event.currentTarget, '/teacher/quizzes', (data) => ({ ...data, course_id: Number(data.course_id), duration_minutes: Number(data.duration_minutes), class_ids: Array.from(event.currentTarget.querySelector('select[name="class_ids"]').selectedOptions).map((option) => Number(option.value)), randomize_questions: event.currentTarget.randomize_questions.checked, randomize_options: event.currentTarget.randomize_options.checked })); }); document.querySelector('#logout').addEventListener('click', LearnovaApi.signOut); LearnovaApi.requireRole('TEACHER').then((user) => { if (user) load(); });
</script></body></html>
