<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | PHILS LEARNOVA</title><link rel="stylesheet" href="/css/styles.css"></head><body><main class="dashboard"><header class="dashboard-header"><div><p class="eyebrow">ADMIN PORTAL</p><h1>Administration workspace</h1></div><button id="logout">Sign out</button></header><section id="metrics" class="dashboard-grid"></section><section class="dashboard-grid"><form id="course-form" class="panel"><h2>Create course</h2><label>Name<input name="name" required maxlength="160"></label><label>Description<textarea name="description"></textarea></label><button>Create course</button><p class="message"></p></form><form id="class-form" class="panel"><h2>Create class</h2><label>Name<input name="name" required maxlength="120"></label><label>Code<input name="code" required maxlength="40"></label><label>Latitude<input name="latitude" type="number" step="any"></label><label>Longitude<input name="longitude" type="number" step="any"></label><label>Radius in meters<input name="radius_meters" type="number" min="1" value="100"></label><button>Create class</button><p class="message"></p></form></section><section class="panel"><h2>Courses</h2><table><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody id="courses"></tbody></table></section></main><script src="/js/api.js"></script><script>
const api = LearnovaApi.apiRequest;
async function load() { try { const [dashboard, courses] = await Promise.all([api('/admin/dashboard'), api('/admin/courses')]); document.querySelector('#metrics').innerHTML = Object.entries(dashboard).map(([key, value]) => `<article class="panel"><h2>${key}</h2><div class="metric">${value}</div></article>`).join(''); document.querySelector('#courses').innerHTML = courses.courses.map((course) => `<tr><td>${course.name}</td><td>${course.status}</td></tr>`).join(''); } catch (error) { document.querySelector('#metrics').textContent = error.message; } }
async function submit(form, url) { const message = form.querySelector('.message'); try { const data = Object.fromEntries(new FormData(form)); if (url.includes('classes')) data.radius_meters = Number(data.radius_meters); await api(url, { method: 'POST', body: JSON.stringify(data) }); form.reset(); message.textContent = 'Saved'; load(); } catch (error) { message.textContent = error.message; } }
document.querySelector('#course-form').addEventListener('submit', (event) => { event.preventDefault(); submit(event.currentTarget, '/admin/courses'); }); document.querySelector('#class-form').addEventListener('submit', (event) => { event.preventDefault(); submit(event.currentTarget, '/admin/classes'); }); document.querySelector('#logout').addEventListener('click', LearnovaApi.signOut); LearnovaApi.requireRole('ADMIN').then((user) => { if (user) load(); });
</script></body></html>
